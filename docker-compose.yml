services:
  db:
    image: postgres:16
    container_name: job-tracker-db
    environment:
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: jobpass
      POSTGRES_DB: job_tracker
    ports:
      - "5432:5432"
    volumes:
      - job-tracker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobuser -d job_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    container_name: job-tracker-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://jobuser:jobpass@db:5432/job_tracker?sslmode=disable
    command: ["up"]
    restart: on-failure

volumes:
  job-tracker-db-data:
